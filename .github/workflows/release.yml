name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto SIGNING_KEYSTORE_BASE64. Ver scripts/create-keystore.sh"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed APK
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "finanzas-${GITHUB_REF_NAME}.apk"

      - name: Verify signature is not the debug key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs "finanzas-${GITHUB_REF_NAME}.apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::APK firmado con clave debug"; exit 1; fi

      - uses: softprops/action-gh-release@v2
        with:
          files: finanzas-${{ github.ref_name }}.apk
          generate_release_notes: true
